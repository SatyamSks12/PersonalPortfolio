version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
    restart: unless-stopped

  contact-api:
    build:
      context: ./backend/contact-api
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    restart: unless-stopped

  assistant-api:
    build:
      context: ./backend/assistant-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped

